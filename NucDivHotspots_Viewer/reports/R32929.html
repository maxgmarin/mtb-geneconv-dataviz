    <title>IGV Variant Inspector </title>

    <!-- igv -->

    <script src="https://cdn.jsdelivr.net/npm/igv@3.5.2/dist/igv.min.js"></script>


    <style type="text/css">
        body {
            font-size: 80%;
            font-family: 'Lucida Grande', Verdana, Arial, Sans-Serif;
        }


    </style>

    <!-- selector table style -->
    <style>

        thead {
            position: sticky;
            top: 0;
        }

        tr {
            cursor: default;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: lightblue;
        }

        th {
            background-color: lightskyblue;
            color: white;
            cursor: pointer;
        }

        .selected {
            background-color: lightblue !important;
            outline: solid thin darkblue !important;
        }
    </style>

    <!-- accordian style,  ref: https://alligator.io/css/collapsible/ -->
    <style type="text/css">
        .wrap-collabsible {
            margin-bottom: 1.2rem;
        }

        input[type='checkbox'] {
            display: none;
        }

        .lbl-toggle {
            display: block;

            font-weight: bold;
            font-family: monospace;
            font-size: 1.2rem;
            text-transform: uppercase;
            text-align: left;

            padding: 1rem;

            color: black;
            background: #dddddd;

            cursor: pointer;

            border-radius: 7px;
            transition: all 0.25s ease-out;
        }

        .lbl-toggle:hover {
            color: blue;
        }

        .lbl-toggle::before {
            content: ' ';
            display: inline-block;

            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 5px solid currentColor;
            vertical-align: middle;
            margin-right: .7rem;
            transform: translateY(-2px);

            transition: transform .2s ease-out;
        }

        .toggle:checked + .lbl-toggle::before {
            transform: rotate(90deg) translateX(-3px);
        }

        .collapsible-content {
            max-height: 0px;
            overflow: auto;
            transition: max-height .25s ease-in-out;
        }

        .toggle:checked + .lbl-toggle + .collapsible-content {
            max-height: 350px;
        }

        .toggle:checked + .lbl-toggle {
            border-bottom-right-radius: 0;
            border-bottom-left-radius: 0;
        }

        .collapsible-content .content-inner {
            background: rgba(250, 224, 66, .2);
            border-bottom: 1px solid rgba(250, 224, 66, .45);
            border-bottom-left-radius: 7px;
            border-bottom-right-radius: 7px;
            padding: .5rem 1rem;
        }
    </style>

</head>

<body>

<div id="container" style="display: flex; flex-direction: column">
    <div id="tableContainer" class="wrap-collabsible">
        <input id="collapsible" class="toggle" type="checkbox" checked>
        <label for="collapsible" class="lbl-toggle">Variants</label>
        <div class="collapsible-content">
            <div id="tableSelectorDiv"></div>
        </div>
    </div>
</div>

</div>

    const locusDictionary = {"0": "NC_000962.3:103002-104000", "1": "NC_000962.3:104002-105000", "2": "NC_000962.3:105002-106000", "3": "NC_000962.3:338002-339000", "4": "NC_000962.3:1095002-1096000", "5": "NC_000962.3:1096002-1097000", "6": "NC_000962.3:1276002-1277000", "7": "NC_000962.3:1340002-1341000", "8": "NC_000962.3:1341002-1342000", "9": "NC_000962.3:1533002-1534000", "10": "NC_000962.3:1634002-1635000", "11": "NC_000962.3:1637002-1638000", "12": "NC_000962.3:1638002-1639000", "13": "NC_000962.3:1788002-1789000", "14": "NC_000962.3:1789002-1790000", "15": "NC_000962.3:2196002-2197000", "16": "NC_000962.3:2262002-2263000", "17": "NC_000962.3:2338002-2339000", "18": "NC_000962.3:2339002-2340000", "19": "NC_000962.3:2626002-2627000", "20": "NC_000962.3:2867002-2868000", "21": "NC_000962.3:2944002-2945000", "22": "NC_000962.3:3135002-3136000", "23": "NC_000962.3:3730002-3731000", "24": "NC_000962.3:3732002-3733000", "25": "NC_000962.3:3735002-3736000", "26": "NC_000962.3:3746002-3747000", "27": "NC_000962.3:3750002-3751000", "28": "NC_000962.3:3842002-3843000", "29": "NC_000962.3:3847002-3848000", "30": "NC_000962.3:3883002-3884000", "31": "NC_000962.3:3895002-3896000", "32": "NC_000962.3:3932002-3933000", "33": "NC_000962.3:3934002-3935000", "34": "NC_000962.3:3943002-3944000", "35": "NC_000962.3:3947002-3948000", "36": "NC_000962.3:4254002-4255000"}
    let sortOption = "BASE"

    document.addEventListener("DOMContentLoaded", function () {

    })


    function initIGV() {

        var igvDiv

        igvDiv = document.getElementById("igvDiv")
        var options = {"reference": {"fastaURL": "https://pub-4ffd5d52d77a41f7b1f7021fbd09c3d2.r2.dev/reference/H37Rv/GCF_000195955.2_ASM19595v2_genomic.fasta", "indexURL": "https://pub-4ffd5d52d77a41f7b1f7021fbd09c3d2.r2.dev/reference/H37Rv/GCF_000195955.2_ASM19595v2_genomic.fasta.fai"}, "tracks": [{"name": "H37Rv Gene Annotation", "type": "annotation", "format": "gff3", "url": "https://pub-4ffd5d52d77a41f7b1f7021fbd09c3d2.r2.dev/reference/H37Rv/GCF_000195955.2_ASM19595v2_genomic.GenesOnly.gff", "height": 100, "autoHeight": "True", "displayMode": "EXPANDED", "visibilityWindow": 30000}, {"name": "R32929 Assembly Alignment", "url": "https://pub-4ffd5d52d77a41f7b1f7021fbd09c3d2.r2.dev/samples/Mtb151/R32929/R32929.mm2.AsmToH37Rv.asm10.cram", "indexURL": "https://pub-4ffd5d52d77a41f7b1f7021fbd09c3d2.r2.dev/samples/Mtb151/R32929/R32929.mm2.AsmToH37Rv.asm10.cram.crai", "height": 50, "showCoverage": "False", "autoHeight": "True", "format": "cram", "type": "alignment"}, {"name": "R32929 LR Alignments (100X-capped)", "url": "https://pub-4ffd5d52d77a41f7b1f7021fbd09c3d2.r2.dev/samples/Mtb151/R32929/R32929.LR.AlnToH37Rv.Subsample100x.cram", "indexURL": "https://pub-4ffd5d52d77a41f7b1f7021fbd09c3d2.r2.dev/samples/Mtb151/R32929/R32929.LR.AlnToH37Rv.Subsample100x.cram.crai", "height": 300, "showCoverage": "True", "autoHeight": "True", "samplingDepth": 1000, "format": "cram", "type": "alignment"}], "roi": [{"name": "NucDivHotspots.37.1kb", "url": "/n/data1/hms/dbmi/farhat/mm774/Projects/Mtb-GeneConv/NucFlag_Snakemake_TestOutputs_Mtb151/_shared/NucDivHotspots.37.1kb.bed", "type": "roi", "format": "bed"}]}

        igv.createBrowser(igvDiv, options)
            .then(function (b) {
                if (sortOption === "BASE") sortOption = "NONE"
                initTable(b)
                searchAndSort(b, locusDictionary["0"])
            })
    }

    function initTable(igvBrowser) {

        const table = document.createElement("table")
        table.id = "variant_table"
        table.style.width = "100%"

        document.getElementById("tableSelectorDiv").appendChild(table)

        const thead = document.createElement('thead')
        table.appendChild(thead)
        const headerRow = thead.insertRow(0)

        const headers = tableJson.headers
        for (let j = 1; j < headers.length; j++) {
            var cell = document.createElement("th")
            headerRow.appendChild(cell)
            cell.innerHTML = headers[j]
        }

        const tbody = document.createElement('tbody')
        table.appendChild(tbody)
        const tableRows = tableJson.rows
        for (let i = 0; i < tableRows.length; i++) {

            const json = tableRows[i]
            const unique_id = json[0]
            const row = document.createElement("tr")
            row.id = "row_" + unique_id
            tbody.appendChild(row)

            // First row selected by default
            if (i === 0) row.classList.add("selected")

            row.onclick = function (event) {
                const list = document.getElementById("variant_table").getElementsByTagName("tr")
                for (let i = 0; i < list.length; i++) {
                    list[i].classList.remove("selected")
                }
                const rowID = event.target.parentElement.id
                const row = document.getElementById(rowID)
                row.classList.add("selected")
                const uniqueId = rowID.substring(4)
                const locus = locusDictionary[uniqueId]
                searchAndSort(igvBrowser, locus)
            }

            for (let j = 1; j < headers.length; j++) {

                var value = json[j]
                cell = document.createElement("td")
                cell.rowID = i
                row.appendChild(cell)
                cell.innerHTML = value
            }
        }

        // Add sorting.  Adapted from https://stackoverflow.com/questions/14267781/sorting-html-table-with-javascript/49041392
        Array.prototype.slice.call(document.querySelectorAll('th')).forEach(function (th) {
            th.addEventListener('click', function () {
                //var table = th.parentNode
                //while (table.tagName.toUpperCase() != 'TABLE') table = table.parentNode;
                Array.prototype.slice.call(table.querySelectorAll('tr:nth-child(n+1)'), 1)
                    .sort(comparer(Array.prototype.slice.call(th.parentNode.children).indexOf(th), this.asc = !this.asc))
                    .forEach(function (tr) {
                        table.appendChild(tr)
                    })
            })
        })


        function getCellValue(tr, idx) {
            return tr.children[idx].innerText || tr.children[idx].textContent
        }

        function comparer(idx, asc) {
            return function (a, b) {
                return function (v1, v2, asc) {
                    // Special case for chromosome coloumn
                    if (idx === 0 && v1.startsWith('chr') && v2.startsWith('chr')) {
                        v1 = v1.substr(3)
                        v2 = v2.substr(3)
                    }
                    // always put empty columns at end of table when sorting
                    if (v1 == '' && v2 != '') {
                        return 1
                    }
                    if (v2 == '' && v1 != '') {
                        return -1
                    }

                    var isNumber = v1 !== '' && v2 !== '' && !isNaN(v1) && !isNaN(v2)
                    ret = isNumber ? v1 - v2 : v1.toString().localeCompare(v2)

                    // reverse ordering if not ascending order
                    if (!asc) {
                        ret = -1 * ret
                    }
                    return (ret)

                }(getCellValue(a, idx), getCellValue(b, idx), asc)
            }
        }

    }


    function searchAndSort(igvBrowser, locus) {
        igvBrowser.search(locus)
            .then(function (ignore) {
                const locusObject = parseLocus(locus)
                const isSNV = locusObject && locusObject.start === locusObject.end
                if (sortOption !== "NONE" || isSNV) {
                    const option = sortOption === "NONE" ? "BASE" : sortOption
                    const position = Math.floor((locusObject.start + locusObject.end) / 2)
                    const sortObject = {
                        chr: locusObject.chr,
                        position: position,
                        option: option,
                        direction: true
                    }
                    const alignmentTracks = igvBrowser.findTracks("type", "alignment")
                    for (let t of alignmentTracks) {
                        t.sort(sortObject)
                    }
                }

            })

    }

    function parseLocus(locus) {
        const a = locus.split(":")
        if (a.length === 2) {
            const b = a[1].split("-")
            if (b.length === 2) {
                return {
                    chr: a[0],
                    start: Number.parseInt(b[0]) - 1,
                    end: Number.parseInt(b[1])
                }
            }
        }
        return undefined
    }
